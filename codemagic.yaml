workflows:
  gohar-traders-android:
    name: Gohar Traders Android APK
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      groups:
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.gohartraders.app"
        APP_NAME: "Gohar Traders"
      node: 22
      java: 21

    scripts:
      - name: Install web and Capacitor dependencies
        script: |
          npm ci
          npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build the Vite web app
        script: |
          npm run build

      - name: Generate the Capacitor Android project
        script: |
          rm -rf android
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build installable APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/reports/**

    publishing:
      email:
        recipients:
          - goharhumayun@gmail.com
        notify:
          success: true
          failure: true

  gohar-traders-ios:
    name: Gohar Traders iOS Simulator (Unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - firebase_credentials
      vars:
        BUNDLE_ID: "com.gohartraders.app"
        APP_NAME: "Gohar Traders"
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install web and Capacitor dependencies
        script: |
          npm ci
          npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest

      - name: Build the Vite web app
        script: |
          npm run build

      - name: Generate the Capacitor iOS project
        script: |
          rm -rf ios
          npx cap init "$APP_NAME" "$BUNDLE_ID" --web-dir dist
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS Simulator app
        script: |
          cd ios/App
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Simulator app
        script: |
          cd ios/App/build/ios-simulator/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app Gohar-Traders-iOS-Simulator.zip

    artifacts:
      - ios/App/build/ios-simulator/Build/Products/Debug-iphonesimulator/Gohar-Traders-iOS-Simulator.zip
      - ios/App/build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
      - ios/App/build/ios-simulator/Build/Products/Debug-iphonesimulator/*.dSYM

    publishing:
      email:
        recipients:
          - goharhumayun@gmail.com
        notify:
          success: true
          failure: true
