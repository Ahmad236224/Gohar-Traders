<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gohar Traders CRM</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #edf7f0; }
      .boot-status {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #166534;
        font: 700 15px "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-status">Opening Gohar Traders…</div></div>
    <script>
      window.addEventListener("error", function () {
        var root = document.getElementById("root");
        if (root && root.querySelector(".boot-status")) {
          root.innerHTML =
            '<div class="boot-status">The app could not start. Please check your internet connection, then close and reopen it.</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
