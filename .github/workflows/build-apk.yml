name: Build Android APK

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Pinned Capacitor Dependencies
        run: |
          npm install --no-save \
            @capacitor/core@7.6.4 \
            @capacitor/cli@7.6.4 \
            @capacitor/android@7.6.4

      - name: Build Web Assets
        run: npm run build

      - name: Create Capacitor Android Project
        run: |
          npx --no-install cap init "Gohar Traders" "com.gohartraders.app" --web-dir dist
          npx --no-install cap add android

      - name: Sync Capacitor
        run: npx --no-install cap sync android

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
