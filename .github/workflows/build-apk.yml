name: Build Android APK

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor Dependencies
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets (if applicable)
        run: npm run build --if-present

      - name: Create Capacitor Android Project
        run: |
          if [ ! -d android ]; then
            npx --no-install cap init "Gohar Traders" "com.gohartraders.app" --web-dir dist
            npx --no-install cap add android
          fi

      - name: Sync Capacitor
        run: npx --no-install cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
